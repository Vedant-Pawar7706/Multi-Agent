services:
  # -----------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -----------------------------------------------------------
  - type: web
    name: mytrip-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./voyageai.db

  # -----------------------------------------------------------
  # 2. React (Vite) Frontend Static Site
  # -----------------------------------------------------------
  - type: web
    name: mytrip-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mytrip-backend
          property: host
        # Example: https://mytrip-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
